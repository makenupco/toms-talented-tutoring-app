name: Deploy static landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create static landing page
        run: |
          mkdir -p dist/web
          cat > dist/web/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Tom's Talented Tutoring App</title>
            <style>
              body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
              .card{background:#fff;border-radius:12px;padding:32px;max-width:720px;box-shadow:0 20px 40px rgba(0,0,0,.15);}
              h1{margin:0 0 8px;font-size:28px}
              p{margin:0 0 16px;color:#555}
              .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
              .feature{background:#f7f9fc;padding:12px;border-radius:8px;border-left:4px solid #667eea}
              .links{margin-top:18px;display:flex;gap:10px}
              a.btn{padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600}
              a.primary{background:#667eea;color:#fff}
              a.secondary{border:1px solid #667eea;color:#667eea;background:#fff}
            </style>
          </head>
          <body>
            <div class="card">
              <h1>🎵 Tom's Talented Tutoring</h1>
              <p>A complete music creation, AI tools, and live tutoring platform with Stripe and PayPal monetization.</p>

              <div class="grid">
                <div class="feature"><strong>🎶 Music Creation</strong><div>Professional composition tools and editors.</div></div>
                <div class="feature"><strong>🤖 AI Tools</strong><div>AI-assisted features for faster workflows.</div></div>
                <div class="feature"><strong>👨‍🏫 Live Tutoring</strong><div>Real-time sessions with experienced instructors.</div></div>
                <div class="feature"><strong>💳 Monetization</strong><div>Stripe and PayPal integrations for payments.</div></div>
              </div>

              <div class="links">
                <a class="btn primary" href="https://github.com/makenupco/toms-talented-tutoring-app">View on GitHub</a>
                <a class="btn secondary" href="https://github.com/makenupco/toms-talented-tutoring-app#readme">Documentation</a>
              </div>

            </div>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Output deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.page_url }}"
