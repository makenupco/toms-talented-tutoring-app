name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm check

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build server
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Create dist web directory
        run: |
          mkdir -p dist/web
          cat > dist/web/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Tom's Talented Tutoring App</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
                      -webkit-font-smoothing: antialiased;
                      -moz-osx-font-smoothing: grayscale;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      padding: 20px;
                  }
                  .container {
                      text-align: center;
                      background: white;
                      border-radius: 12px;
                      padding: 40px;
                      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                      max-width: 600px;
                  }
                  h1 {
                      color: #333;
                      margin-bottom: 16px;
                      font-size: 2.5em;
                  }
                  .subtitle {
                      color: #666;
                      font-size: 1.1em;
                      margin-bottom: 32px;
                      line-height: 1.6;
                  }
                  .features {
                      display: grid;
                      grid-template-columns: 1fr 1fr;
                      gap: 20px;
                      margin: 32px 0;
                      text-align: left;
                  }
                  .feature {
                      padding: 20px;
                      background: #f8f9fa;
                      border-radius: 8px;
                      border-left: 4px solid #667eea;
                  }
                  .feature h3 {
                      color: #667eea;
                      margin-bottom: 8px;
                      font-size: 1.1em;
                  }
                  .feature p {
                      color: #666;
                      font-size: 0.95em;
                      line-height: 1.5;
                  }
                  .status {
                      background: #e8f5e9;
                      border: 2px solid #4caf50;
                      color: #2e7d32;
                      padding: 16px;
                      border-radius: 8px;
                      margin: 24px 0;
                      font-weight: 500;
                  }
                  .links {
                      margin-top: 32px;
                      display: flex;
                      gap: 12px;
                      justify-content: center;
                      flex-wrap: wrap;
                  }
                  .btn {
                      display: inline-block;
                      padding: 12px 24px;
                      border-radius: 6px;
                      text-decoration: none;
                      font-weight: 600;
                      transition: all 0.3s ease;
                      cursor: pointer;
                      border: none;
                      font-size: 1em;
                  }
                  .btn-primary {
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                  }
                  .btn-primary:hover {
                      transform: translateY(-2px);
                      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
                  }
                  .btn-secondary {
                      background: white;
                      color: #667eea;
                      border: 2px solid #667eea;
                  }
                  .btn-secondary:hover {
                      background: #f8f9fa;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🎵 Tom's Talented Tutoring</h1>
                  <p class="subtitle">A complete music creation, AI tools, and live tutoring platform with Stripe and PayPal monetization</p>
                  
                  <div class="status">
                      ✓ Successfully deployed to GitHub Pages
                  </div>
                  
                  <div class="features">
                      <div class="feature">
                          <h3>🎶 Music Creation</h3>
                          <p>Professional music creation tools and composition suite</p>
                      </div>
                      <div class="feature">
                          <h3>🤖 AI Tools</h3>
                          <p>Powerful AI-powered features and intelligent assistance</p>
                      </div>
                      <div class="feature">
                          <h3>👨‍🏫 Live Tutoring</h3>
                          <p>Real-time tutoring sessions with experienced instructors</p>
                      </div>
                      <div class="feature">
                          <h3>💳 Monetization</h3>
                          <p>Stripe and PayPal integration for payments</p>
                      </div>
                  </div>
                  
                  <div class="links">
                      <a href="https://github.com/makenupco/toms-talented-tutoring-app" class="btn btn-primary">View on GitHub</a>
                      <a href="https://github.com/makenupco/toms-talented-tutoring-app#readme" class="btn btn-secondary">Documentation</a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
